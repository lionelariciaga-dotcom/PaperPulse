<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PaperPulse</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b0f19;
  color: white;
}

header {
  background: #111827;
  padding: 20px;
  text-align: center;
  border-bottom: 1px solid #273244;
}

.logo {
  font-size: 28px;
  font-weight: bold;
}

.logo span {
  color: #22c55e;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 20px;
}

.balance {
  background: #111827;
  padding: 20px;
  border-radius: 15px;
  margin-bottom: 20px;
}

.balance h2 {
  margin: 0 0 8px;
}

.money {
  font-size: 30px;
  font-weight: bold;
  color: #22c55e;
}

.stock {
  background: #111827;
  border: 1px solid #273244;
  border-radius: 15px;
  padding: 20px;
  margin-bottom: 15px;
}

.stock-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.symbol {
  font-size: 22px;
  font-weight: bold;
}

.company {
  color: #9ca3af;
}

.price {
  font-size: 24px;
  font-weight: bold;
}

.change {
  color: #22c55e;
  margin-top: 5px;
}

.buttons {
  display: flex;
  gap: 10px;
  margin-top: 15px;
}

button {
  flex: 1;
  padding: 12px;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.buy {
  background: #22c55e;
  color: white;
}

.sell {
  background: #ef4444;
  color: white;
}

button:active {
  transform: scale(.98);
}

.portfolio {
  margin-top: 25px;
  background: #111827;
  padding: 20px;
  border-radius: 15px;
}

.reset {
  margin-top: 20px;
  background: #374151;
  color: white;
}
</style>
</head>

<body>

<header>
  <div class="logo">Paper<span>Pulse</span></div>
  <div>Practice trading with virtual money</div>
</header>

<div class="container">

  <div class="balance">
    <h2>Paper Balance</h2>
    <div class="money" id="balance">$10,000.00</div>
  </div>

  <div id="stocks"></div>

  <div class="portfolio">
    <h2>My Portfolio</h2>
    <p>Shares owned: <b id="shares">0</b></p>
    <p>Portfolio value: <b id="portfolio">$0.00</b></p>
  </div>

  <button class="reset" onclick="resetGame()">Reset Game</button>

</div>

<script>

let balance = 10000;
let shares = 0;

let stocks = [
  {
    symbol: "PPL",
    company: "PaperPulse",
    price: 125.50,
    change: 1.42
  },
  {
    symbol: "TEC",
    company: "TechCore",
    price: 245.20,
    change: 2.18
  },
  {
    symbol: "NXT",
    company: "NextGen",
    price: 87.40,
    change: -0.63
  }
];

function money(number) {
  return "$" + number.toLocaleString("en-US", {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  });
}

function renderStocks() {

  const container = document.getElementById("stocks");

  container.innerHTML = "";

  stocks.forEach((stock, index) => {

    const card = document.createElement("div");

    card.className = "stock";

    const changeColor =
      stock.change >= 0 ? "#22c55e" : "#ef4444";

    card.innerHTML = `
      <div class="stock-top">

        <div>
          <div class="symbol">${stock.symbol}</div>
          <div class="company">${stock.company}</div>
        </div>

        <div style="text-align:right">
          <div class="price">${money(stock.price)}</div>
          <div style="color:${changeColor}">
            ${stock.change >= 0 ? "+" : ""}${stock.change.toFixed(2)}%
          </div>
        </div>

      </div>

      <div class="buttons">
        <button class="buy" onclick="buyStock(${index})">
          Buy 1
        </button>

        <button class="sell" onclick="sellStock(${index})">
          Sell 1
        </button>
      </div>
    `;

    container.appendChild(card);
  });

  updatePortfolio();
}

function buyStock(index) {

  let stock = stocks[index];

  if (balance >= stock.price) {

    balance -= stock.price;

    shares++;

    updatePortfolio();

  } else {

    alert("You don't have enough virtual money!");

  }
}

function sellStock(index) {

  let stock = stocks[index];

  if (shares > 0) {

    balance += stock.price;

    shares--;

    updatePortfolio();

  } else {

    alert("You don't own any shares!");

  }
}

function updatePortfolio() {

  document.getElementById("balance").textContent =
    money(balance);

  document.getElementById("shares").textContent =
    shares;

  let totalValue = shares * stocks[0].price;

  document.getElementById("portfolio").textContent =
    money(totalValue);
}

function resetGame() {

  balance = 10000;
  shares = 0;

  stocks[0].price = 125.50;
  stocks[1].price = 245.20;
  stocks[2].price = 87.40;

  renderStocks();
}

function movePrices() {

  stocks.forEach(stock => {

    let movement =
      (Math.random() - 0.5) * 4;

    stock.price += movement;

    if (stock.price < 1) {
      stock.price = 1;
    }

    stock.change = movement;

  });

  renderStocks();
}

renderStocks();

setInterval(movePrices, 3000);

</script>

</body>
</html>
